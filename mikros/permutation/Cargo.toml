[package]
name = "mikros-permutation"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Root-field Mikros permutation PIOP and committed word-wiring adapter."

[dependencies]
flock-core = { path = "../../crates/flock-core" }
flock-field = { path = "../../crates/flock-field" }
flock-multilinear = { path = "../../crates/flock-multilinear" }
flock-transcript = { path = "../../crates/flock-transcript" }
blake3 = { version = "1.5", features = ["rayon"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
flock-hash = { path = "../../crates/flock-hash" }
bincode = "1.3"

[lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
