[package]
name = "mikros-fri"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Packed GHASH multilinear openings through pinned Binius additive FRI"

[features]
default = ["parallel-encode", "fixed-leaf-sha"]
fixed-leaf-sha = []
parallel-encode = []
single-mle = []

[dependencies]
flock-field = { path = "../../crates/flock-field" }
blake3 = "1.5"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
binius-utils = { git = "https://github.com/binius-zk/binius64", rev = "a41ff589ad23ed6e158e997c0ba85ede777fdce8", features = ["rayon"] }
binius-field = { git = "https://github.com/binius-zk/binius64", rev = "a41ff589ad23ed6e158e997c0ba85ede777fdce8" }
binius-hash = { git = "https://github.com/binius-zk/binius64", rev = "a41ff589ad23ed6e158e997c0ba85ede777fdce8" }
binius-iop = { git = "https://github.com/binius-zk/binius64", rev = "a41ff589ad23ed6e158e997c0ba85ede777fdce8" }
binius-iop-prover = { git = "https://github.com/binius-zk/binius64", rev = "a41ff589ad23ed6e158e997c0ba85ede777fdce8", features = ["rayon"] }
binius-ip-prover = { git = "https://github.com/binius-zk/binius64", rev = "a41ff589ad23ed6e158e997c0ba85ede777fdce8", features = ["rayon"] }
binius-math = { git = "https://github.com/binius-zk/binius64", rev = "a41ff589ad23ed6e158e997c0ba85ede777fdce8", features = ["rayon"] }
binius-transcript = { git = "https://github.com/binius-zk/binius64", rev = "a41ff589ad23ed6e158e997c0ba85ede777fdce8" }

[dev-dependencies]
bincode = "1.3"

[[bench]]
name = "fri_pipeline"
harness = false

