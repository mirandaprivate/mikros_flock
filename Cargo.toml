[workspace]
members = [
    "mikros",
    "mikros/permutation",
    "crates/flock-core",
    "crates/flock-cuda-ffi",
    "crates/flock-field",
    "crates/flock-hash",
    "crates/flock-merkle",
    "crates/flock-multilinear",
    "crates/flock-parallel",
    "crates/flock-prover",
    "crates/flock-transcript",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Succinct Labs", "Benedikt Bunz", "William Wang"]

[workspace.dependencies]
flock-field = { path = "crates/flock-field" }
flock-hash = { path = "crates/flock-hash" }
flock-merkle = { path = "crates/flock-merkle" }
flock-multilinear = { path = "crates/flock-multilinear" }
flock-parallel = { path = "crates/flock-parallel" }
flock-transcript = { path = "crates/flock-transcript" }
rayon = "1.10"
sha2 = { version = "0.10", features = ["asm"] }
rand_core = "0.9"
blake3 = "1.5"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
toml = "0.8"
serde_json = "1"

# Workspace lints for indexed numeric kernels and packed-field interfaces.
[workspace.lints.clippy]
needless_range_loop = "allow"
explicit_counter_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
identity_op = "allow"
erasing_op = "allow"
# Explicit lane copies and layout assertions.
manual_memcpy = "allow"
assertions_on_constants = "allow"
# Documentation layout and hexadecimal test seeds.
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
unusual_byte_groupings = "allow"
wildcard_imports = "deny"

[profile.bench]
# line-tables-only adds function names + line numbers for sampling profilers
# (samply, Instruments) at minimal compile-time cost.
# `lto = "thin"` keeps cross-crate inlining across flock-core / flock-prover, so
# the workspace split does not regress benchmarks.
debug = "line-tables-only"
lto = "thin"
codegen-units = 1
