[package]
name = "mikros-binius-optimized"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]
members = ["kernel"]
exclude = ["../snapshot", "../snapshot/lookup", "../snapshot/crates/*"]

[dependencies]
mikros-lookup = { package = "mikros-permutation-snapshot", path = "../snapshot/lookup" }
kernel = { package = "mikros-binius-kernel", path = "kernel" }
baseline-adapter = { package = "mikros-binius-permutation", path = ".." }
flock-core = { path = "../snapshot/crates/flock-core" }
flock-field = { path = "../snapshot/crates/flock-field" }
flock-hash = { path = "../snapshot/crates/flock-hash" }
flock-transcript = { path = "../snapshot/crates/flock-transcript" }
flock-multilinear = { path = "../snapshot/crates/flock-multilinear" }
flock-parallel = { path = "../snapshot/crates/flock-parallel" }
rayon = "1.10"
blake3 = { version = "1.5", features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

[profile.release]
opt-level = 3

[lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
