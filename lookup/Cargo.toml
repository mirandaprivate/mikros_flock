[package]
name = "mikros-lookup"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Bitwidth-aware permutation and permutation-based indexed Lasso over F128"

# Standalone workspace with its own lockfile and build directory.
[workspace]
exclude = ["vendor/whir"]

[features]
default = ["whir"]
whir = ["dep:whir", "dep:ark-ff", "dep:ark-serialize", "dep:ark-std", "dep:zeroize"]

[dependencies]
flock-field = { path = "../crates/flock-field" }
flock-transcript = { path = "../crates/flock-transcript" }
flock-hash = { path = "../crates/flock-hash" }
flock-multilinear = { path = "../crates/flock-multilinear" }
mikros = { path = "../mikros" }
blake3 = "1.5"
serde = { version = "1", features = ["derive"] }
rayon = "1.10"
whir = { path = "vendor/whir", default-features = false, features = ["parallel"], optional = true }
ark-ff = { version = "0.5", optional = true }
ark-serialize = { version = "0.5", optional = true }
ark-std = { version = "0.5", features = ["std"], optional = true }
zeroize = { version = "1", optional = true }

[dev-dependencies]
bincode = "1.3"
serde_json = "1"

[profile.release]
opt-level = 3

[lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
